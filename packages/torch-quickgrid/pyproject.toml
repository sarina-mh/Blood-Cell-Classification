[project]
name = "torch-quickgrid"
version = "0.1.0"
description = "A tiny, dependency-light grid search + training loop for PyTorch models."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
